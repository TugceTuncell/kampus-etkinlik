<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="2311012063.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>
    <main>
        <h2>Etkinlik Ekle</h2>
        <p>Yıldızlı (*) alanlar zorunludur.</p>
        <form id="etkinlik-formu" novalidate>
            <p>
                <label for="ad">Etkinlik Adı *</label>
                <input type="text" id="ad" name="ad">
                <span id="ad-hata" class="hata-mesaji"></span>
            </p>
            <p>
                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                </select>
                <span id="kategori-hata" class="hata-mesaji"></span>
            </p>
            <p>
                <label for="tarih">Tarih *</label>
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-mesaji"></span>
            </p>
            <p>
                <label for="saat">Saat *</label>
                <input type="time" id="saat" name="saat">
                <span id="saat-hata" class="hata-mesaji"></span>
            </p>
            <p>
                <label for="yer">Yer *</label>
                <input type="text" id="yer" name="yer" placeholder="Örn: A Blok">
                <span id="yer-hata" class="hata-mesaji"></span>
            </p>
            <p>
                <label for="kontenjan">Kontenjan (İsteğe bağlı)</label>
                <input type="number" id="kontenjan" name="kontenjan">
                <span id="kontenjan-hata" class="hata-mesaji"></span>
            </p>
            <p>
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                <span id="aciklama-hata" class="hata-mesaji"></span>
            </p>
            <button type="submit">Kaydet</button>
        </form>
        <div id="form-mesaj"></div>
    </main>
    <br><footer><p>Tuğçe Tuncel &middot; 2311012063 &middot; 2026</p></footer>
</body>
</html>
